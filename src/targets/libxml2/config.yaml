# libxml2: candidate target (see TERM_PROJECT_PLAN.md §3).
name: libxml2
# Official GitHub mirror of gitlab.gnome.org/GNOME/libxml2 (more reliable to clone).
repo: https://github.com/GNOME/libxml2.git
# master on 2026-09-23
ref: c43dc98d27ac315a48d93dbd399c6c22cf7125b1

# xmlversion.h is generated by the build, so parse the installed headers.
header_base: build
headers:
  - libxml/*.h
include_dirs: []
defines: []

static_lib: lib/libxml2.a
link_flags: [-lz, -lm]

# OSS-Fuzz fuzzers live in the repo (fuzz/oss-fuzz-build.sh). fuzz.c is a shared
# helper; genSeed.c and testFuzzer.c are tools with their own main(); lint.c also
# needs xmllint's objects, which this build does not produce.
harness_globs:
  - fuzz/*.c
harness_exclude:
  - fuzz/fuzz.c
  - fuzz/genSeed.c
  - fuzz/testFuzzer.c
  - fuzz/lint.c
harness_support:
  - fuzz/fuzz.c

seed_globs:
  - "test/*.xml"
  - "test/HTML/*.html"
  - "test/valid/*.xml"
  - "test/schemas/*.xsd"
  - "test/XPath/docs/*"
  - "fuzz/static_seed/**/*"
