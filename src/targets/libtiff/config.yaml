# libtiff: candidate target (see TERM_PROJECT_PLAN.md §3).
name: libtiff
repo: https://gitlab.com/libtiff/libtiff.git
# master on 2026-09-27
ref: d23249978a7a99ea2e0752a476611914501577de

# tiffconf.h / tiffvers.h are generated by the build, so parse the installed headers.
header_base: build
headers:
  - tiffio.h
  - tiff.h
include_dirs: []
defines: []

static_lib: lib/libtiff.a
# OSS-Fuzz's tiff_read_rgba_fuzzer uses TIFFStreamOpen from the C++ wrapper.
extra_static_libs: [lib/libtiffxx.a]
link_flags: [-lzstd, -llzma, -ljpeg, -lz, -lm]

harness_globs:
  - contrib/oss-fuzz/*.cc

seed_globs:
  - "test/images/*.tif"
  - "test/images/*.tiff"
