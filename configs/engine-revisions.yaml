# configs/engine-revisions.yaml - which Turso build is which, and what each is for.
#
# Three revisions matter to this project. They are three points in time, not a
# disagreement: a report that cites only one of them is ambiguous about whether
# the defect was present.

turso:
  - commit: 730017f96
    date: 2026-10-28
    contains_our_fixes: false
    role: >
      The revision the discovery campaign ran against. Defect #1 was first
      observed here, 2026-10-28T19:58:43Z.

  - commit: b588fbdc6
    date: 2026-11-01
    contains_our_fixes: false
    role: >
      The revision defect #1 was re-verified on before the report was filed,
      and the base of pull request #11225. Defect #4's cost was measured here
      (about 34 s and an 11.7 GB peak). This is the "before" binary: build it
      to reproduce either finding's original behaviour.

  - commit: 7f0a9e6f4
    date: 2026-11-02
    contains_our_fixes: true
    role: >
      Contains both merged fixes (ec86571642a6 for #11225, 121cd0a8c80b for
      #11259). This is the "after" binary: both findings' statements now return
      'string or blob too big (18)' promptly. It is the pinned commit in
      configs/targets.yaml.

version_string: Turso 0.9.0-pre.2
